<svg viewBox="0 0 640 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .word { font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif; }
      .tag { font-family: "Jost", "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect x="0" y="0" width="640" height="340" fill="#FAF5EA"/>

  <!-- icon: simplified lotus/butta motif traced from the floral pattern on the real saree,
       reduced to flat petal shapes so it stays legible at favicon size -->
  <g transform="translate(320,92)">
    <g transform="rotate(0)">   <path d="M0 0 C-12 -22 -10 -40 0 -54 C10 -40 12 -22 0 0 Z" fill="#A9793A"/></g>
    <g transform="rotate(51.4)"><path d="M0 0 C-12 -22 -10 -40 0 -54 C10 -40 12 -22 0 0 Z" fill="#A9793A"/></g>
    <g transform="rotate(102.8)"><path d="M0 0 C-12 -22 -10 -40 0 -54 C10 -40 12 -22 0 0 Z" fill="#A9793A"/></g>
    <g transform="rotate(154.3)"><path d="M0 0 C-12 -22 -10 -40 0 -54 C10 -40 12 -22 0 0 Z" fill="#A9793A"/></g>
    <g transform="rotate(205.7)"><path d="M0 0 C-12 -22 -10 -40 0 -54 C10 -40 12 -22 0 0 Z" fill="#A9793A"/></g>
    <g transform="rotate(257.1)"><path d="M0 0 C-12 -22 -10 -40 0 -54 C10 -40 12 -22 0 0 Z" fill="#A9793A"/></g>
    <g transform="rotate(308.6)"><path d="M0 0 C-12 -22 -10 -40 0 -54 C10 -40 12 -22 0 0 Z" fill="#A9793A"/></g>
    <circle cx="0" cy="0" r="8" fill="#971C4C"/>
  </g>

  <!-- wordmark -->
  <text x="320" y="238" class="word" font-size="94" font-weight="500"
        fill="#2A2320" text-anchor="middle" letter-spacing="0.5">Saanvitha</text>

  <!-- kinara rule -->
  <g>
    <rect x="272" y="262" width="96" height="1.4" fill="#A9793A"/>
    <rect x="272" y="267" width="96" height="5" fill="#971C4C"/>
  </g>

  <!-- tagline -->
  <text x="320" y="300" class="tag" font-size="15" font-weight="400"
        fill="#8C6428" text-anchor="middle" letter-spacing="4.5">HANDLOOM SAREES</text>
  <text x="320" y="322" class="tag" font-size="11" font-weight="400"
        fill="#9C9084" text-anchor="middle" letter-spacing="2.5">EST. HYDERABAD</text>
</svg>
